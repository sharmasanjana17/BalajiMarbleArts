<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Royal Metallic Gold Gradient -->
    <linearGradient id="goldRoyal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D4" />
      <stop offset="20%" stop-color="#DFBA73" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="80%" stop-color="#E5C583" />
      <stop offset="100%" stop-color="#8C6721" />
    </linearGradient>

    <radialGradient id="archGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#DFBA73" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#151515" stop-opacity="0" />
    </radialGradient>

    <filter id="archShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Presentation Canvas -->
  <rect width="900" height="650" fill="#151515" />
  <circle cx="450" cy="200" r="220" fill="url(#archGlow)" />

  <!-- Monogram Symbol: The Monumental Roman Arch & Entwined BM Monogram -->
  <g transform="translate(450, 195)" filter="url(#archShadow)">
    <!-- Classical Outer Archway (Pediment & Roman Vault) -->
    <!-- Semi-circular Outer Moulding -->
    <path d="M -85, 95 L -85, -20 A 85 85 0 0 1 85, -20 L 85, 95" 
          fill="none" 
          stroke="url(#goldRoyal)" 
          stroke-width="2.5" />
          
    <!-- Inner Arch Vault -->
    <path d="M -72, 95 L -72, -20 A 72 72 0 0 1 72, -20 L 72, 95" 
          fill="none" 
          stroke="url(#goldRoyal)" 
          stroke-width="1.2" 
          stroke-dasharray="3,3" 
          opacity="0.7" />

    <!-- Architectural Keystone at Arch Apex -->
    <polygon points="0,-115 15,-115 11,-88 -11,-88 -15,-115" fill="url(#goldRoyal)" />
    <!-- Pediment Arch Cornice Line -->
    <line x1="-95" y1="95" x2="95" y2="95" stroke="url(#goldRoyal)" stroke-width="2" />
    <line x1="-105" y1="102" x2="105" y2="102" stroke="url(#goldRoyal)" stroke-width="3" stroke-linecap="round" />

    <!-- Twin Left & Right Architectural Capitals -->
    <rect x="-92" y="-22" width="14" height="6" fill="url(#goldRoyal)" rx="1" />
    <rect x="78" y="-22" width="14" height="6" fill="url(#goldRoyal)" rx="1" />

    <!-- Interior Monogram: Monumental B & M Interlocking Typography -->
    <!-- Left Stem of B / M -->
    <path d="M -42,-65 L -20,-65 L -20,80 L -42,80 Z" fill="url(#goldRoyal)" />
    <!-- Inner Column Groove Line -->
    <line x1="-31" y1="-55" x2="-31" y2="70" stroke="#151515" stroke-width="2" />

    <!-- Upper Bow of B with Chiseled Serif Corners -->
    <path d="M -20,-65 
             L 24,-65 
             C 48,-65 62,-50 62,-28 
             C 62,-8 48, 5 24, 5 
             L -20, 5 Z
             M -4,-50
             L 20,-50
             C 36,-50 46,-42 46,-28
             C 46,-14 36,-8 20,-8
             L -4,-8 Z" 
          fill="url(#goldRoyal)" />

    <!-- Lower Bow of B transitioning into M leg -->
    <path d="M -20, 5 
             L 28, 5 
             C 54, 5 70, 20 70, 48 
             C 70, 75 52, 80 22, 80 
             L -20, 80 Z
             M -4, 20
             L 22, 20
             C 38, 20 52, 30 52, 48
             C 52, 65 38, 65 22, 65
             L -4, 65 Z" 
          fill="url(#goldRoyal)" />

    <!-- The Architectural M Diagonal Inset (Negative & Positive Chisel) -->
    <path d="M -4,5 L 20,40 L 44,5 L 56,5 L 22,55 L -10,5 Z" fill="#F4D89E" opacity="0.95" />

    <!-- Plinth Base Stone -->
    <rect x="-85" y="85" width="170" height="4" fill="url(#goldRoyal)" opacity="0.5" />
  </g>

  <!-- Typography: BALAJI MARBLE ARTS -->
  <g transform="translate(450, 425)" text-anchor="middle">
    <!-- Brand Primary Name: BALAJI -->
    <text y="0" 
          fill="url(#goldRoyal)" 
          font-family="'Cinzel', 'Playfair Display', 'Trajan Pro', 'Georgia', serif" 
          font-size="44" 
          font-weight="700" 
          letter-spacing="15" 
          filter="url(#archShadow)">BALAJI</text>

    <!-- Heritage Classical Laurel & Star Rule -->
    <g transform="translate(0, 24)">
      <line x1="-180" y1="0" x2="-35" y2="0" stroke="url(#goldRoyal)" stroke-width="1" opacity="0.6" />
      <!-- Star Emblem Motif -->
      <polygon points="0,-6 2,-2 6,0 2,2 0,6 -2,2 -6,0 -2,-2" fill="#F4D89E" />
      <circle cx="-14" cy="0" r="1.5" fill="#C6A15B" />
      <circle cx="14" cy="0" r="1.5" fill="#C6A15B" />
      <line x1="35" y1="0" x2="180" y2="0" stroke="url(#goldRoyal)" stroke-width="1" opacity="0.6" />
    </g>

    <!-- Secondary Descriptor: MARBLE ARTS -->
    <text y="58" 
          fill="#F4F0E7" 
          font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
          font-size="16" 
          font-weight="400" 
          letter-spacing="11" 
          opacity="0.95">MARBLE ARTS</text>

    <!-- Heritage Subtext -->
    <text y="92" 
          fill="#C6A15B" 
          font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
          font-size="9" 
          font-weight="500" 
          letter-spacing="6" 
          opacity="0.75">MONUMENTAL STONE ARCHITECTURE  •  SINCE 2004</text>
  </g>

  <!-- Concept Label (For Presentation) -->
  <text x="450" y="615" 
        text-anchor="middle" 
        fill="#C6A15B" 
        font-family="'Montserrat', sans-serif" 
        font-size="10" 
        letter-spacing="3" 
        opacity="0.5">CONCEPT 3  |  THE MONUMENTAL ROMAN ARCHWAY &amp; CREST</text>
</svg>

