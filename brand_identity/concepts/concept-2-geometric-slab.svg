<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Metallic Champagne Gold Gradient -->
    <linearGradient id="goldSlab1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAE8C8" />
      <stop offset="30%" stop-color="#DFBA73" />
      <stop offset="70%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#916E28" />
    </linearGradient>

    <linearGradient id="goldSlab2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4D89E" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#7A5A1E" />
    </linearGradient>

    <!-- Deep Marble Dark Gradient -->
    <linearGradient id="marbleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242424" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>

    <filter id="slabGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Presentation Canvas -->
  <rect width="900" height="650" fill="#151515" />
  
  <!-- Subtle Architectural Geometric Grid Backdrop -->
  <g opacity="0.04" stroke="#C6A15B" stroke-width="1">
    <line x1="450" y1="50" x2="450" y2="400" />
    <line x1="250" y1="210" x2="650" y2="210" />
    <circle cx="450" cy="210" r="160" fill="none" />
    <circle cx="450" cy="210" r="110" fill="none" />
  </g>

  <!-- Monogram Symbol: Bookmatched Beveled Slabs (B + M + A) -->
  <g transform="translate(450, 205)" filter="url(#slabGlow)">
    <!-- Outer Octagonal Facet Contour (Diamond Marble Miter) -->
    <polygon points="0,-115 82,-75 115,0 82,75 0,115 -82,75 -115,0 -82,-75" 
             fill="none" 
             stroke="url(#goldSlab1)" 
             stroke-width="1.5" 
             opacity="0.35" />

    <!-- Left Marble Pylon (B Vertical Spine with 45° Chiseled Cap) -->
    <path d="M -48,-85 
             L -20,-102 
             L -20,85 
             L -48,68 Z" 
          fill="url(#goldSlab1)" />

    <!-- Upper Marble Slab Wing: Forming Top Loop of 'B' and Left Crest of 'M' -->
    <path d="M -12,-98 
             L 36,-98 
             C 64,-98 84,-80 84,-52 
             C 84,-28 66,-12 36,-12 
             L -12,-12 Z
             M 6,-80
             L 32,-80
             C 48,-80 62,-70 62,-52
             C 62,-36 48,-30 32,-30
             L 6,-30 Z" 
          fill="url(#goldSlab2)" />

    <!-- Lower Marble Slab Wing: Forming Bottom Loop of 'B' and Right Leg of 'M' -->
    <path d="M -12,-4 
             L 44,-4 
             C 74,-4 94,14 94,44 
             C 94,76 72,94 40,94 
             L -12,94 Z
             M 6,14
             L 36,14
             C 54,14 70,26 70,44
             C 70,64 54,76 36,76
             L 6,76 Z" 
          fill="url(#goldSlab1)" />

    <!-- Center Bookmatched Negative Space Cut (The Diamond V-Vein creating 'M' & 'A') -->
    <polygon points="-12,-12 18,-12 44,28 14,28" fill="#151515" />
    <path d="M 12,-10 L 46,38 L 26,38 L -6,-10 Z" fill="url(#goldSlab1)" opacity="0.85" />

    <!-- Precision Laser-Cut Inlay Line (The Golden Seam) -->
    <line x1="-12" y1="-105" x2="-12" y2="98" stroke="#151515" stroke-width="4" />
    <line x1="-12" y1="-105" x2="-12" y2="98" stroke="#F4D89E" stroke-width="1.2" />

    <!-- Floating Axis Accent Pips -->
    <circle cx="0" cy="-115" r="3" fill="#DFBA73" />
    <circle cx="0" cy="115" r="3" fill="#DFBA73" />
  </g>

  <!-- Typography: BALAJI MARBLE ARTS -->
  <g transform="translate(450, 425)" text-anchor="middle">
    <!-- Brand Primary Name: BALAJI -->
    <text y="0" 
          fill="url(#goldSlab1)" 
          font-family="'Cinzel', 'Playfair Display', 'Trajan Pro', 'Georgia', serif" 
          font-size="46" 
          font-weight="700" 
          letter-spacing="16" 
          filter="url(#slabGlow)">BALAJI</text>

    <!-- Refined Architectural Subline Divider -->
    <g transform="translate(0, 24)">
      <line x1="-190" y1="0" x2="-40" y2="0" stroke="url(#goldSlab1)" stroke-width="1" opacity="0.6" />
      <!-- Three Inlaid Stone Rectangles -->
      <rect x="-18" y="-3" width="6" height="6" fill="#C6A15B" transform="rotate(45 -15 0)" />
      <rect x="-3" y="-4" width="8" height="8" fill="#DFBA73" transform="rotate(45 1 0)" />
      <rect x="15" y="-3" width="6" height="6" fill="#C6A15B" transform="rotate(45 18 0)" />
      <line x1="40" y1="0" x2="190" y2="0" stroke="url(#goldSlab1)" stroke-width="1" opacity="0.6" />
    </g>

    <!-- Secondary Descriptor: MARBLE ARTS -->
    <text y="60" 
          fill="#F4F0E7" 
          font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
          font-size="16" 
          font-weight="400" 
          letter-spacing="11" 
          opacity="0.95">MARBLE ARTS</text>

    <!-- Heritage Subtext -->
    <text y="92" 
          fill="#C6A15B" 
          font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
          font-size="9" 
          font-weight="500" 
          letter-spacing="6" 
          opacity="0.75">FINE CRAFTSMANSHIP  •  GRANITE  •  ONYX</text>
  </g>

  <!-- Concept Label (For Presentation) -->
  <text x="450" y="615" 
        text-anchor="middle" 
        fill="#C6A15B" 
        font-family="'Montserrat', sans-serif" 
        font-size="10" 
        letter-spacing="3" 
        opacity="0.5">CONCEPT 2  |  THE GEOMETRIC BOOKMATCHED SLABS</text>
</svg>

