<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D89E" />
      <stop offset="25%" stop-color="#DFBA73" />
      <stop offset="50%" stop-color="#C6A15B" />
      <stop offset="75%" stop-color="#E5C583" />
      <stop offset="100%" stop-color="#9E7B35" />
    </linearGradient>
    <linearGradient id="goldVertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7E2B5" />
      <stop offset="35%" stop-color="#DFBA73" />
      <stop offset="70%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#8C6A24" />
    </linearGradient>
    <linearGradient id="goldSubtle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFBA73" />
      <stop offset="50%" stop-color="#F4D89E" />
      <stop offset="100%" stop-color="#C6A15B" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- BALAJI MARBLE ARTS - PRIMARY LOGO (GOLD) -->
  <!-- Transparent Background for versatile production placement -->
  <g id="logo-root">
    <!-- Architectural Monogram Symbol (Doric Pillar & Keystone BM Monogram) -->
    <g transform="translate(450, 200) scale(1.0)">
      <!-- Plinth Foundation Base -->
      <path d="M -95, 115 L 95, 115 L 85, 122 L -85, 122 Z" fill="url(#goldLinear)" opacity="0.75" />
      <line x1="-70" y1="110" x2="70" y2="110" stroke="url(#goldLinear)" stroke-width="2.5" stroke-linecap="round" />

      <!-- Left Architectural Pillar / Fluted Marble Column -->
      <!-- Column Base Plinth -->
      <path d="M -68, 105 L -36, 105 L -40, 95 L -64, 95 Z" fill="url(#goldVertical)" />
      <!-- Main Column Shaft -->
      <path d="M -64, 95 L -40, 95 L -40, -90 L -64, -90 Z" fill="url(#goldVertical)" />
      <!-- Flute Groove Lines -->
      <line x1="-56" y1="90" x2="-56" y2="-85" stroke="#151515" stroke-width="2" opacity="0.55" />
      <line x1="-48" y1="90" x2="-48" y2="-85" stroke="#F7E2B5" stroke-width="1.2" opacity="0.65" />
      <!-- Capital / Cornice -->
      <path d="M -68, -90 L -36, -90 L -32, -100 L -72, -100 Z" fill="url(#goldVertical)" />

      <!-- Central & Right Monogram Structure: Architectural 'B' & 'M' Chevron Slabs -->
      <!-- Top Geometric Arch / Upper Bowl of 'B' -->
      <path d="M -32, -90 
               L 28, -90 
               C 58, -90 76, -72 76, -42 
               C 76, -16 58, -2 30, -2 
               L -32, -2 Z
               M -16, -74
               L 24, -74
               C 44, -74 58, -62 58, -42
               C 58, -22 44, -18 24, -18
               L -16, -18 Z" 
            fill="url(#goldLinear)" />

      <!-- Bottom Geometric Arch / Lower Bowl of 'B' (Interlocking with M) -->
      <path d="M -32, -2 
               L 36, -2 
               C 68, -2 88, 18 88, 52 
               C 88, 84 66, 104 32, 104 
               L -32, 104 Z
               M -16, 14
               L 30, 14
               C 50, 14 68, 28 68, 52
               C 68, 76 50, 88 30, 88
               L -16, 88 Z" 
            fill="url(#goldVertical)" />

      <!-- Center Architectural Keystone & Chiseled M-Chevron Inlay -->
      <path d="M -16, -2 
               L 18, -2 
               L 42, 38 
               L 66, -2 
               L 76, -2 
               L 46, 52 
               L 38, 52 Z" 
            fill="url(#goldLinear)" opacity="0.95" />

      <!-- Fine Diamond Cut Accent Stones / Slab Joint Pins -->
      <polygon points="45,-98 52,-90 45,-82 38,-90" fill="#F7E2B5" />
      <polygon points="45,108 52,116 45,124 38,116" fill="#F7E2B5" />
    </g>

    <!-- Typography: BALAJI MARBLE ARTS -->
    <g transform="translate(450, 410)" text-anchor="middle">
      <!-- Brand Name: BALAJI -->
      <text y="0" 
            fill="url(#goldVertical)" 
            font-family="'Cinzel', 'Trajan Pro', 'Playfair Display', 'Georgia', serif" 
            font-size="62" 
            font-weight="700" 
            letter-spacing="18" 
            style="text-transform: uppercase;">BALAJI</text>

      <!-- Brand Specialty Tagline: MARBLE ARTS -->
      <text y="54" 
            fill="#DFBA73" 
            font-family="'Montserrat', 'Cinzel', 'Helvetica Neue', sans-serif" 
            font-size="19" 
            font-weight="500" 
            letter-spacing="14" 
            style="text-transform: uppercase;">MARBLE ARTS</text>

      <!-- Architectural Stone Divider Rules & Center Diamond -->
      <g transform="translate(0, 78)">
        <line x1="-220" y1="0" x2="-25" y2="0" stroke="url(#goldSubtle)" stroke-width="1.2" opacity="0.75" />
        <polygon points="0,-4 4,0 0,4 -4,0" fill="#F7E2B5" />
        <line x1="25" y1="0" x2="220" y2="0" stroke="url(#goldSubtle)" stroke-width="1.2" opacity="0.75" />
      </g>
    </g>
  </g>
</svg>