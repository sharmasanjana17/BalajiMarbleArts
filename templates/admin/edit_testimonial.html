{% extends "base.html" %}

{% block title %}Edit Testimonial - Admin{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}

{% block content %}
<div class="admin-dashboard">
    <div class="admin-sidebar">
        <div class="admin-sidebar-header">
            <h4><i class="bi bi-speedometer2 me-2"></i>Admin Panel</h4>
            <a href="{{ url_for('admin_logout') }}" class="btn btn-sm btn-outline-light">
                <i class="bi bi-box-arrow-right"></i>
            </a>
        </div>
        
        <nav class="admin-nav">
            <a href="{{ url_for('admin_dashboard') }}" class="admin-nav-item">
                <i class="bi bi-house"></i> Dashboard
            </a>
            <a href="{{ url_for('admin_testimonials') }}" class="admin-nav-item active">
                <i class="bi bi-chat-quote"></i> Testimonials
            </a>
            <a href="{{ url_for('admin_projects') }}" class="admin-nav-item">
                <i class="bi bi-images"></i> Projects
            </a>
            <a href="{{ url_for('admin_blog') }}" class="admin-nav-item">
                <i class="bi bi-journal-text"></i> Blog Posts
            </a>
            <a href="{{ url_for('admin_faq') }}" class="admin-nav-item">
                <i class="bi bi-question-circle"></i> FAQs
            </a>
            <a href="{{ url_for('admin_contacts') }}" class="admin-nav-item">
                <i class="bi bi-envelope"></i> Contact Leads
            </a>
        </nav>
    </div>
    
    <div class="admin-content">
        <div class="admin-header">
            <h1>Edit Testimonial</h1>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">
                <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>
        
        <div class="admin-form-card">
            <form method="POST" action="{{ url_for('admin_update_testimonial', id=testimonial.id) }}">
                <div class="mb-3">
                    <label for="client_name" class="form-label">Client Name *</label>
                    <input type="text" class="form-control" id="client_name" name="client_name" 
                           value="{{ testimonial.client_name }}" required>
                </div>
                
                <div class="mb-3">
                    <label for="location" class="form-label">Location *</label>
                    <input type="text" class="form-control" id="location" name="location" 
                           value="{{ testimonial.location }}" required>
                </div>
                
                <div class="mb-3">
                    <label for="rating" class="form-label">Rating *</label>
                    <select class="form-select" id="rating" name="rating" required>
                        {% for i in range(1, 6) %}
                        <option value="{{ i }}" {% if testimonial.rating == i %}selected{% endif %}>
                            {{ i }} Star{% if i > 1 %}s{% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-3">
                    <label for="text" class="form-label">Testimonial Text *</label>
                    <textarea class="form-control" id="text" name="text" rows="5" required>{{ testimonial.text }}</textarea>
                </div>
                
                <div class="mb-3">
                    <label for="project_id" class="form-label">Related Project (Optional)</label>
                    <select class="form-select" id="project_id" name="project_id">
                        <option value="">None</option>
                        {% for project in projects %}
                        <option value="{{ project.id }}" {% if testimonial.project_id == project.id %}selected{% endif %}>
                            {{ project.title }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-2"></i>Update Testimonial
                    </button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
