{% extends "base.html" %}

{% block title %}Edit FAQ - Admin{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}

{% block content %}
<div class="admin-dashboard">
    <div class="admin-content-full">
        <div class="admin-header">
            <h1><i class="bi bi-question-circle me-2"></i>Edit FAQ</h1>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">
                <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>
        
        <div class="admin-form-card">
            <form method="POST" action="{{ url_for('admin_edit_faq', id=faq.id) }}">
                <div class="mb-3">
                    <label for="category" class="form-label">Category</label>
                    <input type="text" class="form-control" id="category" name="category" 
                           value="{{ faq.category or '' }}" placeholder="e.g., General, Pricing, Services">
                </div>
                
                <div class="mb-3">
                    <label for="question" class="form-label">Question *</label>
                    <textarea class="form-control" id="question" name="question" rows="2" required>{{ faq.question }}</textarea>
                </div>
                
                <div class="mb-3">
                    <label for="answer" class="form-label">Answer *</label>
                    <textarea class="form-control" id="answer" name="answer" rows="6" required>{{ faq.answer }}</textarea>
                </div>
                
                <div class="mb-3">
                    <label for="order" class="form-label">Display Order</label>
                    <input type="number" class="form-control" id="order" name="order" 
                           value="{{ faq.order or 0 }}" min="0">
                    <small class="form-text text-muted">Lower numbers appear first</small>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-2"></i>Update FAQ
                    </button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
